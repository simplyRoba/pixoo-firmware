display:
  - platform: pixoo64_render_test
    id: render_test_panel
    content_controller: render_test_content_controller
    equalizer: equalizer_dashboard
    # Showing the face sends every column to its digit the long way around,
    # staggered 120ms apart. The first flap of a run takes 350ms and later ones
    # speed up: at 120ms the leftmost leaf is falling, at 260ms it is swinging
    # out of the hinge, and the slowest column lands by 4538ms.
    animation_frames:
      - dashboard: game_of_life
        now_ms: 0
        snapshot: game_of_life
      - dashboard: game_of_life
        now_ms: 150
        snapshot: game_of_life_next_generation
      # The waveform weave and its echoes advance at the production 33ms tick
      # cadence. The first frame covers its wind-out from centre; unsnapshotted
      # ticks let the traces and glow reach the loaded spectrum before the main
      # visual reference is captured.
      - dashboard: equalizer_waveform
        now_ms: 0
        snapshot: equalizer_waveform_start
      - dashboard: equalizer_waveform
        now_ms: 33
      - dashboard: equalizer_waveform
        now_ms: 66
      - dashboard: equalizer_waveform
        now_ms: 99
      - dashboard: equalizer_waveform
        now_ms: 132
      - dashboard: equalizer_waveform
        now_ms: 165
      - dashboard: equalizer_waveform
        now_ms: 198
      - dashboard: equalizer_waveform
        now_ms: 231
      - dashboard: equalizer_waveform
        now_ms: 264
        snapshot: equalizer_waveform
      - dashboard: equalizer_waveform
        now_ms: 2000
        snapshot: equalizer_waveform_color
      - dashboard: clock_split_flap
        now_ms: 0
        snapshot: clock_split_flap_start
      - dashboard: clock_split_flap
        now_ms: 120
        snapshot: clock_split_flap_fall
      - dashboard: clock_split_flap
        now_ms: 260
        snapshot: clock_split_flap_swing
      - dashboard: clock_split_flap
        now_ms: 5000
        snapshot: clock_split_flap
      # Showing the face winds the movement forward out of 12 onto 14:05:38.
      # All three hands leave together, each at its own speed: the geared hour
      # and minute hands arrive at 1093ms, the second hand at 1760ms.
      - dashboard: clock_analog
        now_ms: 0
        snapshot: clock_analog_wind_start
      - dashboard: clock_analog
        now_ms: 700
        snapshot: clock_analog_wind
      - dashboard: clock_analog
        now_ms: 1400
        snapshot: clock_analog_wind_second
      # Settled, then the second hand's step rebound: furthest past its mark at
      # 17ms and furthest short of it at 61ms.
      - dashboard: clock_analog
        now_ms: 1760
        snapshot: clock_analog
      - dashboard: clock_analog
        now_ms: 1777
        snapshot: clock_analog_overshoot
      - dashboard: clock_analog
        now_ms: 1821
        snapshot: clock_analog_undershoot
      - dashboard: clock_analog_midnight
        now_ms: 1821
        snapshot: clock_analog_midnight
      - dashboard: clock_analog_unset
        now_ms: 0
        snapshot: clock_analog_unset
      # The hero icon loops: rain falls through its band and every loop is a
      # pure function of the animation time, so a later frame in the loop
      # differs from its start.
      - dashboard: weather_forecast_rainy
        now_ms: 0
        snapshot: weather_forecast_rainy
      - dashboard: weather_forecast_rainy
        now_ms: 450
        snapshot: weather_forecast_rainy_mid_loop
      # Every loop meets itself: the icon's cycles (900ms rain, 7000ms cloud
      # swell) all repeat together after 63000ms, which draws the frame the
      # loop started from, so no part of the icon jumps at its boundary.
      - dashboard: weather_forecast_rainy
        now_ms: 63000
        snapshot: weather_forecast_rainy
      # A storm holds its bolt visible between strikes and flares on one. The
      # schedule fires at 0 and again at 11967ms, peaking 80ms in, so 3000ms
      # sits between events and 12047ms is at a strike's brightest.
      - dashboard: weather_forecast_thunderstorm
        now_ms: 0
      - dashboard: weather_forecast_thunderstorm
        now_ms: 3000
        snapshot: weather_forecast_thunderstorm
      - dashboard: weather_forecast_thunderstorm
        now_ms: 12047
        snapshot: weather_forecast_thunderstorm_strike
      - dashboard: weather_forecast_hail_thunderstorm
        now_ms: 0
      - dashboard: weather_forecast_hail_thunderstorm
        now_ms: 3000
        snapshot: weather_forecast_hail_thunderstorm
      # Showing the face sweeps the columns in from unlit, 70ms apart, each
      # dot flaring past its resting level over 130ms: at 39ms the hour tens
      # are at the peak of their pop, at 250ms the sweep is part-way across,
      # and the last column settles at 480ms.
      - dashboard: clock_binary
        now_ms: 0
      - dashboard: clock_binary
        now_ms: 39
        snapshot: clock_binary_load_start
      - dashboard: clock_binary
        now_ms: 250
        snapshot: clock_binary_load
      - dashboard: clock_binary
        now_ms: 480
        snapshot: clock_binary
      # The first source condition initializes the face after its loading frame.
      - dashboard: weather_landscape_loading
        now_ms: 0
        snapshot: weather_landscape_lifecycle_loading
      - dashboard: weather_landscape_loading
        now_ms: 100
        snapshot: weather_landscape_lifecycle_loaded
      # The initial sunny frame seeds the retained condition before rain
      # arrives. Cloud, precipitation kind, and amount all differ, so the
      # handoff runs 1920ms from 100ms: a quarter in the cloud deck is thin and
      # few drops have arrived, half-way both are part-way, and it settles by
      # 2020ms.
      - dashboard: weather_landscape_transition
        now_ms: 0
      - dashboard: weather_landscape_transition
        now_ms: 100
        snapshot: weather_landscape_transition_sunny_rainy_start
      - dashboard: weather_landscape_transition
        now_ms: 580
        snapshot: weather_landscape_transition_sunny_rainy_quarter
      - dashboard: weather_landscape_transition
        now_ms: 1060
        snapshot: weather_landscape_transition_sunny_rainy_midpoint
      - dashboard: weather_landscape_transition
        now_ms: 2020
        snapshot: weather_landscape_transition_sunny_rainy_complete
      # Only fog differs, so this handoff runs the minimum 1200ms from 100ms
      # and the bank thickens in place rather than being revealed.
      - dashboard: weather_landscape_fog_transition
        now_ms: 0
      - dashboard: weather_landscape_fog_transition
        now_ms: 100
      - dashboard: weather_landscape_fog_transition
        now_ms: 700
        snapshot: weather_landscape_transition_sunny_fog_midpoint
      - dashboard: weather_landscape_fog_transition
        now_ms: 1300
        snapshot: weather_landscape_transition_sunny_fog_complete
      # Re-showing resumes the retained animation phase at the current tick.
      - dashboard: weather_landscape_lifecycle
        now_ms: 0
      - dashboard: weather_landscape_lifecycle
        now_ms: 1500
        snapshot: weather_landscape_lifecycle_resume
      - dashboard: weather_landscape_lifecycle
        now_ms: 1000001500
        base_visible: false
      - dashboard: weather_landscape_lifecycle
        now_ms: 1000001500
        snapshot: weather_landscape_lifecycle_resume
      # A timed source condition crosses the millis wrap before this deadline.
      - dashboard: weather_landscape_wrap
        now_ms: 4294967040
      - dashboard: weather_landscape_wrap
        now_ms: 256
        snapshot: weather_landscape_lifecycle_wrap
      # The glow breathes slowly while the sun stays on its astronomical arc.
      - dashboard: weather_landscape_day
        now_ms: 0
        snapshot: weather_landscape_day
      - dashboard: weather_landscape_day
        now_ms: 2048
        snapshot: weather_landscape_day_pulse
      - dashboard: weather_landscape_day_moon
        now_ms: 0
        snapshot: weather_landscape_day_moon
      # Each cloud profile advances by several pixels between these frames.
      - dashboard: weather_landscape_partlycloudy
        now_ms: 0
        snapshot: weather_landscape_partlycloudy_start
      - dashboard: weather_landscape_partlycloudy
        now_ms: 6000
        snapshot: weather_landscape_partlycloudy
      # The cloud band completes a scroll period at 32768ms. A cloud keeps its
      # silhouette and fractional position across that wrap.
      - dashboard: weather_landscape_partlycloudy
        now_ms: 32760
        snapshot: weather_landscape_partlycloudy_prewrap
      - dashboard: weather_landscape_partlycloudy
        now_ms: 32776
        snapshot: weather_landscape_partlycloudy_wrap
      - dashboard: weather_landscape_cloud_subpixel
        now_ms: 0
      - dashboard: weather_landscape_cloud_baseline
        now_ms: 0
      - dashboard: weather_landscape_cloudy
        now_ms: 0
        snapshot: weather_landscape_cloudy_start
      - dashboard: weather_landscape_cloudy
        now_ms: 6000
        snapshot: weather_landscape_cloudy
      # Fog, cloud, and representative precipitation frames advance from fixed
      # hashes, making their motion reviewable.
      - dashboard: weather_landscape_fog
        now_ms: 0
        snapshot: weather_landscape_fog_start
      - dashboard: weather_landscape_fog
        now_ms: 8000
        snapshot: weather_landscape_fog
      - dashboard: weather_landscape_fog_night
        now_ms: 0
      - dashboard: weather_landscape_fog_night
        now_ms: 8000
        snapshot: weather_landscape_fog_night
      - dashboard: weather_landscape_drizzle
        now_ms: 0
      - dashboard: weather_landscape_drizzle
        now_ms: 1500
        snapshot: weather_landscape_drizzle
      - dashboard: weather_landscape_freezing_drizzle
        now_ms: 0
      - dashboard: weather_landscape_freezing_drizzle
        now_ms: 1500
        snapshot: weather_landscape_freezing_drizzle
      - dashboard: weather_landscape_rainy
        now_ms: 0
        snapshot: weather_landscape_rainy_start
      - dashboard: weather_landscape_rainy
        now_ms: 1500
        snapshot: weather_landscape_rainy
      - dashboard: weather_landscape_rainy_night
        now_ms: 0
      - dashboard: weather_landscape_rainy_night
        now_ms: 1500
        snapshot: weather_landscape_rainy_night
      - dashboard: weather_landscape_pouring
        now_ms: 0
      - dashboard: weather_landscape_pouring
        now_ms: 1500
        snapshot: weather_landscape_pouring
      - dashboard: weather_landscape_freezing_rain
        now_ms: 0
        snapshot: weather_landscape_freezing_rain_start
      - dashboard: weather_landscape_freezing_rain
        now_ms: 1500
        snapshot: weather_landscape_freezing_rain
      - dashboard: weather_landscape_freezing_rain_night
        now_ms: 0
      - dashboard: weather_landscape_freezing_rain_night
        now_ms: 1500
        snapshot: weather_landscape_freezing_rain_night
      # Slow multi-depth flakes cover day and night; granular snow moves faster.
      - dashboard: weather_landscape_snowy
        now_ms: 0
        snapshot: weather_landscape_snowy_start
      - dashboard: weather_landscape_snowy
        now_ms: 6000
        snapshot: weather_landscape_snowy
      - dashboard: weather_landscape_snowy_night
        now_ms: 0
      - dashboard: weather_landscape_snowy_night
        now_ms: 6000
        snapshot: weather_landscape_snowy_night
      - dashboard: weather_landscape_snow_grains_night
        now_ms: 0
        snapshot: weather_landscape_snow_grains_night_start
      - dashboard: weather_landscape_snow_grains_night
        now_ms: 1600
        snapshot: weather_landscape_snow_grains_night
      # Storms stay quiet between deterministic strikes; active frames show the
      # shared lightning envelope for rain and hail.
      - dashboard: weather_landscape_thunderstorm
        now_ms: 0
      - dashboard: weather_landscape_thunderstorm
        now_ms: 1000
        snapshot: weather_landscape_thunderstorm_idle
      - dashboard: weather_landscape_thunderstorm
        now_ms: 12047
        snapshot: weather_landscape_thunderstorm_active
      - dashboard: weather_landscape_thunderstorm_night
        now_ms: 0
      - dashboard: weather_landscape_thunderstorm_night
        now_ms: 12047
        snapshot: weather_landscape_thunderstorm_night_active
      - dashboard: weather_landscape_hail_thunderstorm
        now_ms: 0
      - dashboard: weather_landscape_hail_thunderstorm
        now_ms: 12047
        snapshot: weather_landscape_hail_thunderstorm_active
    output_dir: esphome/tests/render_test/frames
