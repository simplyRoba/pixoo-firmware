pixoo64_content:
  id: render_test_content_controller
  default_dashboard: text
  notification_font: font_8
  firmware_update_title_font: font_16
  firmware_update_detail_font: font_5
  dashboards:
    - platform: text
      id: text_dashboard
      dashboard_id: text
      panel_font: font_8
      panel_text: render_test_text

    - platform: equalizer
      id: equalizer_dashboard
      dashboard_id: equalizer_bars
      face: bars

    - platform: equalizer
      id: equalizer_waveform_dashboard
      dashboard_id: equalizer_waveform
      face: waveform

    - platform: game_of_life
      id: game_of_life_dashboard
      dashboard_id: game_of_life
      seed: 305419896

    - platform: weather
      id: weather_forecast_sunny
      dashboard_id: weather_forecast_sunny
      face: forecast
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_sunny

    - platform: weather
      id: weather_forecast_fractional
