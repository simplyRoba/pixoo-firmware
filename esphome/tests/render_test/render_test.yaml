      dashboard_id: weather_forecast_hail_thunderstorm
      face: forecast
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_hail_thunderstorm

    # 14:05: the cards riffle up from 00:00.
    - platform: clock
      id: clock_split_flap
      dashboard_id: clock_split_flap
      face: split_flap
      fixed_time: 1616421900

    # 14:05:38, an angle apart on each hand.
    - platform: clock
      id: clock_analog
      dashboard_id: clock_analog
      face: analog
      fixed_time: 1616421938

    # Midnight: the second whose rebound puts the hand at a negative angle.
    - platform: clock
      id: clock_analog_midnight
      dashboard_id: clock_analog_midnight
      face: analog
      fixed_time: 1616371200

    # Midday: sun near the top of its arc over Berlin.
    - platform: weather
      id: weather_landscape_day
      dashboard_id: weather_landscape_day
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_sky_day

    # Morning: sun low on the left, orange dawn sky.
    - platform: weather
      id: weather_landscape_morning
      dashboard_id: weather_landscape_morning
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616398200
      source: src_sky_day

    # Dusk: mid-twilight at sunset, with each body at its local sky position.
    - platform: weather
      id: weather_landscape_dusk
      dashboard_id: weather_landscape_dusk
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616433810
      source: src_sky_day

    # Daylight with the Moon high and close to the Sun: the discs overlap, so
    # the Sun's glow must composite over the Moon instead of replacing it.
    - platform: weather
      id: weather_landscape_day_moon
      dashboard_id: weather_landscape_day_moon
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1653277800
      source: src_sky_day

    # Night: the Moon appears only when above Berlin's local horizon.
    - platform: weather
      id: weather_landscape_night
      dashboard_id: weather_landscape_night
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616460000
      source: src_sky_night

    - platform: weather
      id: weather_landscape_loading
      dashboard_id: weather_landscape_loading
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_loading

    - platform: weather
      id: weather_landscape_transition
      dashboard_id: weather_landscape_transition
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_landscape_transition

    # Fog composites translucently rather than writing opaque pixels, so its
    # cross-fade exercises a different path from the other conditions.
    - platform: weather
      id: weather_landscape_fog_transition
      dashboard_id: weather_landscape_fog_transition
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_fog_transition

    - platform: weather
      id: weather_landscape_lifecycle
      dashboard_id: weather_landscape_lifecycle
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_landscape_lifecycle

    - platform: weather
      id: weather_landscape_wrap
      dashboard_id: weather_landscape_wrap
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_weather_wrap

    # Partly cloudy afternoon: moving clouds can cross the sun.
    - platform: weather
      id: weather_landscape_partlycloudy
      dashboard_id: weather_landscape_partlycloudy
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_sky_partlycloudy

    # Isolated cloud timeline and matching cloud-free scene for fractional-motion
    # assertions without advancing a snapshot dashboard's effect clock.
    - platform: weather
      id: weather_landscape_cloud_subpixel
      dashboard_id: weather_landscape_cloud_subpixel
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_sky_partlycloudy

    - platform: weather
      id: weather_landscape_cloud_baseline
      dashboard_id: weather_landscape_cloud_baseline
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616421900
      source: src_sky_day

    # Cloudy night: cloud layers pass in front of the moon and starfield.
    - platform: weather
      id: weather_landscape_cloudy
      dashboard_id: weather_landscape_cloudy
      face: landscape
      font_small: font_5
      font_big: font_16
      fixed_time: 1616460000
