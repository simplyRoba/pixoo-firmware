    temperature: 22
    apparent_temperature: 21
    humidity: 55
    high: 25
    low: 13
    start_hour: 14
    forecast_temperatures: [22, 23, 21]
    location:
      latitude: 52.5200
      longitude: 13.4050
  - id: src_sky_cloudy
    condition: cloudy
