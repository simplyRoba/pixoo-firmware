    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

text:
  - platform: template
    id: render_test_text
    mode: text
    optimistic: true
    initial_value: "Hello"

# Public fixture: Berlin city center (52.5200 N, 13.4050 E).
# One fixed snapshot per frame, served through the WeatherSource port in place
# of the Open-Meteo adapter.
pixoo64_render_test:
  - id: src_sky_day
    condition: sunny
    temperature: 24
    apparent_temperature: 23
    humidity: 50
    high: 26
    low: 12
    start_hour: 12
    forecast_temperatures: [24, 25, 23]
    location:
      latitude: 52.5200
      longitude: 13.4050
  - id: src_sky_night
    condition: sunny
    night: true
    temperature: 14
    apparent_temperature: 13
    humidity: 70
    high: 26
    low: 12
    start_hour: 23
