# Dashboard render test. Renders each dashboard through the real
# pixoo64_content controller pipeline (controller -> WeatherDashboard ->
# WeatherModel -> RenderWeather) with fixed inputs and a fixed clock, and
# byte-compares each rendered frame to frames/<id>.png. Deterministic: the clock
# is pinned via `fixed_time` so the hero temperature, clock, date, and forecast
# labels are stable on the host (the host RTC would report wall-clock time).
# Run:    esphome compile esphome/tests/render_test/render_test.yaml, then run the binary
# Update: PIXOO_UPDATE_SNAPSHOTS=1 <built binary>
esphome:
  name: pixoo64-render-test
  includes:
    - ../../components/pixoo64_content/dashboard
    - ../../components/pixoo64_content/notification
    - ../../components/pixoo64_content/reaction
    - ../../../pixoo_protocol/include/pixoo_cmd.h
    - ../../../pixoo_protocol/include/pixoo_frame.h
    - ../../../pixoo_protocol/src/pixoo_frame.cpp
    - ../../../pixoo_protocol/include/pixoo_framebuffer.h
    - ../../../pixoo_protocol/src/pixoo_framebuffer.cpp
    - ../../../pixoo_content/include/dashboard/weather/weather_data.h
    - ../../../pixoo_content/src/dashboard/weather/weather_data.cpp
    - ../../../pixoo_content/include/dashboard/weather/weather_source.h
    - ../../../pixoo_content/include/dashboard/weather/wmo.h
    - ../../../pixoo_content/src/dashboard/weather/wmo.cpp
    - ../../../pixoo_content/include/dashboard/weather/weather_effects.h
    - ../../../pixoo_content/src/dashboard/weather/weather_effects.cpp
    - ../../../pixoo_content/include/dashboard/weather/sky_astronomy.h
    - ../../../pixoo_content/src/dashboard/weather/sky_astronomy.cpp
    - ../../../pixoo_content/include/dashboard/clock/split_flap.h
    - ../../../pixoo_content/src/dashboard/clock/split_flap.cpp
    - ../../../pixoo_content/include/dashboard/clock/analog_clock.h
    - ../../../pixoo_content/src/dashboard/clock/analog_clock.cpp
    - ../../../pixoo_content/include/dashboard/clock/binary_clock.h
    - ../../../pixoo_content/src/dashboard/clock/binary_clock.cpp
    - ../../../pixoo_content/include/dashboard/game_of_life/game_of_life.h
    - ../../../pixoo_content/src/dashboard/game_of_life/game_of_life.cpp
    - ../../../pixoo_content/include/dashboard/equalizer/spectrum.h
    - ../../../pixoo_content/include/dashboard/equalizer/equalizer_processor.h
    - ../../../pixoo_app/include/app_state.h
    - ../../../pixoo_app/src/app_state.cpp
    - ../../../pixoo_app/include/frame_metrics.h
    - ../../../pixoo_app/include/firmware_app.h
    - ../../../pixoo_app/include/pixoo_sound.h

host:

external_components:
  - source:
      type: local
      path: ../../components
    components: [pixoo64_content]
  - source:
      type: local
      path: components
    components: [pixoo64_render_test]

font:
  - file: ../../fonts/TomThumb.bdf
    id: font_5
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'
  - file: ../../fonts/PixelOperator8.ttf
    id: font_8
    size: 8
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'
  - file: ../../fonts/PixelOperator.ttf
    id: font_16
