[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D__LINUX__
    -DPNGLE_NO_GAMMA_CORRECTION
    -DUSE_PIXOO64_NOW_PLAYING
    -I../../components/pixoo64
    -I../../../pixoo_content/include/dashboard/now_playing
lib_deps =
    bitbank2/JPEGDEC@1.8.4
    kikuchan98/pngle@1.1.0
