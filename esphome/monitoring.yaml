# state_class is cleared on the numeric sensors so Home Assistant keeps only
# default recorder history, not long-term statistics.

debug:
  update_interval: 300s

pixoo64:
  frame_metrics:
    window: 30s
    average:
      name: Frame Preparation Time Average
    maximum:
      name: Frame Preparation Time Maximum
    rendered_fps:
      name: Rendered FPS
    sent_fps:
      name: Sent FPS
    late_frames:
      name: Late Frames
    busy_drops:
      name: Busy Drops

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 300s
    entity_category: diagnostic
    state_class: ""
  - platform: uptime
    type: timestamp
    name: Last Boot
    time_id: panel_time
    entity_category: diagnostic
    icon: mdi:timer-outline
  - platform: debug
    free:
      name: Free Memory (Internal)
      entity_category: diagnostic
      device_class: data_size
      state_class: ""
      icon: mdi:memory
    psram:
      name: Free Memory (PSRAM)
      entity_category: diagnostic
      device_class: data_size
      state_class: ""
      icon: mdi:memory

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
      entity_category: diagnostic
